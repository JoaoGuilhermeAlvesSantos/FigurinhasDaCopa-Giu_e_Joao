<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lista de figurinhas repetidas para compartilhar e controlar trocas." />
  <title>Lista de Repetidas · Figurinhas da Prof Giu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="duplicated.css" />
</head>
<body>
  <main class="container duplicate-page">
    <header class="duplicate-hero">
      <div>
        <p class="hero-eyebrow">📦 Lista de Repetidas</p>
        <h1 style="margin:.5rem 0 0;font-size:clamp(1.8rem,5vw,2.4rem);">Todas as Figurinhas do Álbum</h1>
        <p style="margin-top:.75rem; color:var(--text-muted); max-width:760px; line-height:1.6;">
          Esta página mostra todas as figurinhas do álbum, por time e seção.
          Marque as repetidas e copie a lista para enviar aos seus amigos.
        </p>
      </div>
    </header>

    <div class="duplicate-page-actions">
      <button id="dup-back-button" class="duplicate-action-btn secondary">← Voltar</button>
      <button id="dup-copy-marked" class="duplicate-action-btn">Copiar repetidos</button>
      <button id="dup-reset-markers" class="duplicate-action-btn secondary">Resetar marcações</button>
      <span id="dup-copy-status" class="duplicate-copy-status"></span>
    </div>

    <div class="duplicate-search-row">
      <label class="search-label" for="duplicate-search">Pesquisar</label>
      <input id="duplicate-search" class="search-input" type="search"
        placeholder="Nome ou sigla do time" autocomplete="off" />
    </div>

    <div class="duplicate-list" id="duplicate-list"></div>
  </main>

  <script src="duplicate_data.js"></script>
  <script src="duplicated_stickers.js"></script>
</body>
</html>
